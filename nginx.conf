# FIXED Nginx configuration for MusicRx with HSTS enabled
# Replace your current /etc/nginx/sites-available/musicrx with this
# This version avoids conflicts with existing SSL settings

server {
    listen 80;
    server_name www.musicrx.app;

    # Redirect www to non-www (HTTP to HTTP)
    return 301 http://musicrx.app$request_uri;
}

server {
    listen 80;
    server_name musicrx.app;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://musicrx.app$request_uri;
}

server {
    listen 443 ssl;
    server_name www.musicrx.app;

    # SSL Configuration for www (same cert as main domain)
    ssl_certificate /etc/letsencrypt/live/musicrx.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musicrx.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS (HTTP Strict Transport Security) - ENABLED!
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve static files from Vercel and proxy to API, but redirect HTML content
    location ^~ /api/ {
        proxy_pass https://musicrx.app/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host musicrx.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files - serve from Vercel
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp3|mp4|mov|avi)$ {
        proxy_pass https://musicrx.app;
        proxy_set_header Host musicrx.app;
    }

    # Redirect HTML content (pages) from www to non-www
    location ~* \.(html|htm)$ {
        return 301 https://musicrx.app$request_uri;
    }

    # Root level requests (homepage, main app) - redirect
    location = / {
        return 301 https://musicrx.app$request_uri;
    }

    # Everything else - redirect to main domain
    location / {
        return 301 https://musicrx.app$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name musicrx.app;

    # SSL Configuration (Certbot managed - keep existing)
    ssl_certificate /etc/letsencrypt/live/musicrx.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musicrx.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS (HTTP Strict Transport Security) - ENABLED!
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # API proxy to backend (CORRECTED PORT: 3000, not 3003)
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # API specific security headers
        add_header X-API-Version "v1" always;
    }

    # Serve static frontend files
    root /var/www/musicrx/public;
    index index.html;

    # Main application (SPA support)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static files with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Security: Block access to hidden files
    location ~ /\. {
        deny all;
    }
}
