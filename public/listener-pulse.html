    <style>
        .pulse-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }

        .pulse-header {
            margin-bottom: 3rem;
            margin-top: 4rem;
        }

        .pulse-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .pulse-subtitle {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            color: var(--text-color);
            margin-bottom: 2rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .artist-search {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .artist-search input {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-background);
            color: var(--text-color);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
        }

        .artist-search input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .artist-search button {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .artist-search button:hover {
            background: var(--rgb-glow);
            transform: translateY(-2px);
        }

        .map-container {
            height: 600px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            margin-bottom: 2rem;
            position: relative;
        }

        #worldMap {
            height: 100%;
            width: 100%;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .pulse-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-background);
            backdrop-filter: blur(15px);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px var(--glow);
            border-color: var(--primary);
        }

        .stat-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .stat-detail {
            font-size: 0.9rem;
            color: var(--secondary);
        }

        .mood-indicator {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .mood-happy { background: #4CAF50; color: white; }
        .mood-sad { background: #2196F3; color: white; }
        .mood-energetic { background: #FF9800; color: white; }
        .mood-calm { background: #9C27B0; color: white; }
        .mood-neutral { background: #607D8B; color: white; }

        .recent-listeners {
            background: var(--card-background);
            backdrop-filter: blur(15px);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .listeners-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .listener-item {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.3s ease;
        }

        .listener-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .listener-item:last-child {
            border-bottom: none;
        }

        .listener-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 1rem;
            border: 2px solid var(--border-color);
        }

        .listener-info h4 {
            margin: 0;
            color: var(--primary);
            font-size: 1rem;
        }

        .listener-info p {
            margin: 0.25rem 0 0 0;
            color: var(--secondary);
            font-size: 0.8rem;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #f44336;
            color: #f44336;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Leaflet customizations */
        .leaflet-popup-content-wrapper {
            background: var(--card-background);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
        }

        .leaflet-popup-tip {
            background: var(--card-background);
        }

        .leaflet-popup-content {
            margin: 1rem;
        }

        .leaflet-control-attribution {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .pulse-container {
                padding: 1rem;
            }

            .pulse-title {
                font-size: 2rem;
            }

            .map-container {
                height: 400px;
            }

            .pulse-stats {
                grid-template-columns: 1fr;
            }

            .artist-search {
                flex-direction: column;
            }

            .stat-card {
                padding: 1rem;
            }

        // Initialize map
        function initMap() {
            map = L.map('worldMap', {
                center: [20, 0],
                zoom: 2,
                minZoom: 2,
                maxZoom: 8,
                worldCopyJump: true
            });

            // Use a dark theme map
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap contributors © CARTO',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            // Remove default zoom control and add custom positioned one
            map.zoomControl.remove();
            L.control.zoom({
                position: 'bottomright'
            }).addTo(map);
        }

        // Clear existing markers
        function clearMarkers() {
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];
        }

        // Add city markers with pulse data
        function addCityMarkers(pulseData) {
            clearMarkers();

            pulseData.cities.forEach(city => {
                const coords = cityCoordinates[city.country];
                if (!coords) return;

                // Calculate marker size based on popularity (10-30px)
                const markerSize = Math.max(10, Math.min(30, 10 + (city.popularity / 100) * 20));

                // Create custom marker icon
                const markerIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="
                        width: ${markerSize}px;
                        height: ${markerSize}px;
                        background: var(--primary);
                        border: 3px solid var(--secondary);
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        color: white;
                        font-weight: bold;
                        font-size: ${markerSize * 0.4}px;
                        box-shadow: 0 0 10px var(--primary)80;
                        animation: pulse 2s infinite;
                    ">${Math.round(city.popularity)}</div>`,
                    iconSize: [markerSize, markerSize],
                    iconAnchor: [markerSize/2, markerSize/2]
                });

                const marker = L.marker(coords, { icon: markerIcon }).addTo(map);

                // Create popup content
                const popupContent = `
                    <div style="text-align: center; min-width: 200px;">
                        <h4 style="margin: 0 0 0.5rem 0; color: var(--primary);">${city.country}</h4>
                        <p style="margin: 0.25rem 0; color: var(--text-color);">
                            <strong>"${city.track.name}"</strong><br>
                            by ${city.track.artist}
                        </p>
                        <p style="margin: 0.25rem 0; color: var(--secondary); font-size: 0.9rem;">
                            ${city.track.listeners ? city.track.listeners.toLocaleString() : 'N/A'} listeners<br>
                            ${city.track.playcount ? city.track.playcount.toLocaleString() : 'N/A'} plays
                        </p>
                    </div>
                `;

                marker.bindPopup(popupContent);
                markers.push(marker);
            });

            // Fit map to show all markers
            if (markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds(), { padding: [20, 20] });
            }
        }

        // Get color based on mood
        function getMoodColor(mood) {
            const colors = {
                'happy': '#4CAF50',
                'sad': '#2196F3',
                'energetic': '#FF9800',
                'calm': '#9C27B0',
                'neutral': '#607D8B',
                'high-energy': '#FF5722',
                'danceable': '#E91E63'
            };
            return colors[mood.split('-')[0]] || colors.neutral;
        }

        // Update stats display - show ALL available countries
        function updateStats(pulseData) {
            const statsContainer = document.getElementById('statsContainer');
            const statsHtml = pulseData.cities.map(city => `
                <div class="stat-card">
                    <div class="stat-title">${city.country}</div>
                    <div class="stat-value">${Math.round(city.popularity)}</div>
                    <div class="stat-detail">Popularity Score</div>
                    <div class="stat-detail" style="margin-top: 0.5rem;">
                        <strong>"${city.track.name}"</strong><br>
                        ${city.track.listeners ? city.track.listeners.toLocaleString() : 'N/A'} listeners
                    </div>
                </div>
            `).join('');

            statsContainer.innerHTML = statsHtml;
            statsContainer.style.display = 'grid';
        }

        // Load recent listeners for an artist
        async function loadRecentListeners(artistName) {
            try {
                // This would require Last.fm user data, for now we'll show a placeholder
                const recentContainer = document.getElementById('recentListeners');
                const listenersList = document.getElementById('listenersList');

                // Placeholder data - in real implementation, this would come from Last.fm user.getRecentTracks
                const placeholderListeners = [
                    { username: 'musicfan123', avatar: 'https://dummyimage.com/40x40/333/666&text=MF', lastTrack: 'Blinding Lights', timeAgo: '2 minutes ago' },
                    { username: 'groovelover', avatar: 'https://dummyimage.com/40x40/333/666&text=GL', lastTrack: 'Save Your Tears', timeAgo: '5 minutes ago' },
                    { username: 'weekndfan', avatar: 'https://dummyimage.com/40x40/333/666&text=WF', lastTrack: 'Heartless', timeAgo: '8 minutes ago' },
                    { username: 'popvibes', avatar: 'https://dummyimage.com/40x40/333/666&text=PV', lastTrack: 'Starboy', timeAgo: '12 minutes ago' }
                ];

                const listenersHtml = placeholderListeners.map(listener => `
                    <div class="listener-item">
                        <img src="${listener.avatar}" alt="${listener.username}" class="listener-avatar">
                        <div class="listener-info">
                            <h4>${listener.username}</h4>
                            <p>Last played: ${listener.lastTrack} • ${listener.timeAgo}</p>
                        </div>
                    </div>
                `).join('');

                listenersList.innerHTML = listenersHtml;
                recentContainer.style.display = 'block';

            } catch (error) {
                console.error('Error loading recent listeners:', error);
            }
        }

        // Search for artist pulse
        async function searchArtistPulse(artistName) {
            if (!artistName.trim()) {
                showError('Please enter an artist name');
                return;
            }

            currentArtist = artistName;
            showLoading(true);

            try {
                console.log(`Searching for listener pulse: ${artistName}`);

                const response = await fetch(`${BACKEND_URL}/api/listener-pulse/${encodeURIComponent(artistName)}`);

                if (!response.ok) {
                    if (response.status === 404) {
                        showError(`No listener pulse data found for "${artistName}". Try a different artist.`);
                    } else {
                        showError('Failed to load listener pulse data. Please try again.');
                    }
                    return;
                }

                const pulseData = await response.json();

                if (pulseData.cities && pulseData.cities.length > 0) {
                    addCityMarkers(pulseData);
                    updateStats(pulseData);
                    loadRecentListeners(artistName);
                    hideError();
                } else {
                    showError(`No trending data found for "${artistName}" in major cities.`);
                }

            } catch (error) {
                console.error('Pulse search error:', error);
                showError('Network error. Please check your connection and try again.');
            } finally {
                showLoading(false);
            }
        }

        // UI helper functions
        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = show ? 'flex' : 'none';
        }

        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
            errorContainer.style.display = 'block';
        }

        function hideError() {
            document.getElementById('errorContainer').style.display = 'none';
        }

        // Event listeners
        document.getElementById('searchBtn').addEventListener('click', () => {
            const artistName = document.getElementById('artistInput').value.trim();
            searchArtistPulse(artistName);
        });

        document.getElementById('artistInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const artistName = document.getElementById('artistInput').value.trim();
                searchArtistPulse(artistName);
            }
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            initMap();

            // Auto-search for The Weeknd on load
            setTimeout(() => {
                searchArtistPulse('The Weeknd');
            }, 1000);
        });

        // Add CSS animation for markers
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.2); opacity: 0.7; }
                100% { transform: scale(1); opacity: 1; }
            }
            .custom-marker {
                pointer-events: none;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
