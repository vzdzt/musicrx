<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicRx - Choose Your Album</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .album-selector {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .vinyl-template {
            background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 100%);
            border-radius: 20px;
            padding: 3rem 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .vinyl-template::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(147, 51, 234, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .album-preview {
            margin-bottom: 2rem;
        }

        .album-cover {
            width: 250px;
            height: 250px;
            border-radius: 15px;
            object-fit: cover;
            margin: 0 auto 1.5rem;
            display: block;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border: 3px solid rgba(255,255,255,0.9);
            transition: all 0.3s ease;
        }

        .album-cover:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .album-info h2 {
            font-family: 'Syncopate', sans-serif;
            font-size: 2.5rem;
            color: #1f2937;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .album-info p {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            color: #6b7280;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 2rem;
        }

        .input-group input {
            width: 100%;
            max-width: 400px;
            padding: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Space Grotesk', sans-serif;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .select-btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .select-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }

        .select-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .download-btn {
            background: var(--primary, #f97316);
            color: white;
            border: 2px solid var(--primary, #f97316);
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .download-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.3);
            background: #ea580c;
            border-color: #ea580c;
        }

        .download-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            color: #6b7280;
            font-style: italic;
        }

        .error {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            display: none;
        }

        @media (max-width: 768px) {
            .album-selector {
                padding: 1rem;
            }

            .vinyl-template {
                padding: 2rem 1rem;
            }

            .album-cover {
                width: 300px;
                height: 300px;
            }

            .album-info h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="cursor"></div>
    <canvas id="universe"></canvas>

    <nav class="navbar global-nav">
        <div class="nav-logo">
            <span class="logo-symbol"><i class="fas fa-heartbeat"></i></span>
        </div>
        <div class="dropdown">
            <button class="dropdown-toggle"><i class="fas fa-bars"></i></button>
            <div class="dropdown-menu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                    <li><a href="news.html">News</a></li>
                    <li><a href="underground.html">Underground</a></li>
                    <li><a href="tools.html">Tools</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <button id="themeToggle" title="Normal Mode"><i class="fas fa-palette"></i></button>
    <button id="backToTop" title="Back to Top"><i class="fas fa-arrow-up"></i></button>

    <div class="album-selector">
        <div class="vinyl-template">
            <div class="album-preview">
                <img id="albumCover" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjQwMCIgdmlld0JveD0iMCAwIDQwMCA0MDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSI0MDAiIGhlaWdodD0iNDAwIiBmaWxsPSIjRjNGNEY2Ii8+CjxwYXRoIGQ9Ik0yMDAgMjAwSDE2MEwxNjAgMTYwSDE2MEwxNjAgMjQwSDE2MEwyMDAgMjQwTDIwMCAyMDBaIiBmaWxsPSIjOUNBM0FGIi8+CjxjaXJjbGUgY3g9IjIwMCIgY3k9IjIwMCIgcj0iNDAiIGZpbGw9IiM5Q0EzQUYiLz4KPHN2Zz4=" alt="Album Cover Preview" class="album-cover">
                <div class="album-info">
                    <h2 id="albumTitle">Choose Your Album</h2>
                    <p id="albumArtist">Enter a Spotify Album ID below</p>
                </div>
            </div>

            <div class="input-group">
                <input
                    type="text"
                    id="albumIdInput"
                    placeholder="Enter Spotify Album ID (e.g., 4aawyAB9vmqN3uQ7FjRGTy)"
                    required
                >
            </div>

            <div class="button-group">
                <button id="selectBtn" class="select-btn" onclick="selectAlbum()">
                    <i class="fas fa-search"></i> Select Album
                </button>
                <button id="downloadBtn" class="download-btn" onclick="downloadAlbumCard()" disabled>
                    <i class="fas fa-download"></i> Download Card
                </button>
            </div>

            <p class="loading" id="loadingText">Loading album details...</p>

            <div class="error" id="errorMessage"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="nav-logo">
            <span class="logo-symbol"><i class="fas fa-heartbeat"></i></span>
        </div>
        <div class="footer-content">
            <p>© 2025 MusicRx. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>

    <script>
        // Configuration
        const BACKEND_URL = window.location.hostname === 'localhost' ? 'http://localhost:3001' : 'https://musicrx.app';

        let currentAlbum = null;

        async function selectAlbum() {
            const albumId = document.getElementById('albumIdInput').value.trim();
            const selectBtn = document.getElementById('selectBtn');
            const loadingText = document.getElementById('loadingText');
            const errorMessage = document.getElementById('errorMessage');

            if (!albumId) {
                showError('Please enter a Spotify Album ID');
                return;
            }

            // Basic validation - Spotify IDs are usually 22 characters
            if (albumId.length < 10) {
                showError('Please enter a valid Spotify Album ID');
                return;
            }

            // Show loading state
            selectBtn.disabled = true;
            selectBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            loadingText.style.display = 'block';
            errorMessage.style.display = 'none';

            try {
                // Fetch album data from Spotify via our backend
                const response = await fetch(`${BACKEND_URL}/api/album/${albumId}`);

                if (!response.ok) {
                    throw new Error(`Failed to fetch album: ${response.status}`);
                }

                const albumData = await response.json();

                // Store album data for download functionality
                currentAlbum = albumData;

                // Update preview with album data
                if (albumData.imageUrl) {
                    document.getElementById('albumCover').src = albumData.imageUrl;
                }
                document.getElementById('albumTitle').textContent = albumData.title;
                document.getElementById('albumArtist').textContent = `by ${albumData.artist}`;

                // Enable download button
                document.getElementById('downloadBtn').disabled = false;

                // Navigate to review page
                setTimeout(() => {
                    window.location.href = `album-review.html?id=${albumId}`;
                }, 1000);

            } catch (error) {
                console.error('Album selection error:', error);
                showError('Failed to load album. Please check the ID and try again.');
            } finally {
                selectBtn.disabled = false;
                selectBtn.innerHTML = '<i class="fas fa-search"></i> Select Album';
                loadingText.style.display = 'none';
            }
        }

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        async function downloadAlbumCard() {
            if (!currentAlbum) return;

            const downloadBtn = document.getElementById('downloadBtn');
            const originalText = downloadBtn.innerHTML;
            downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
            downloadBtn.disabled = true;

            try {
                // Create a compact, professional album card (800x600 instead of 1200x675)
                const cardDiv = document.createElement('div');
                cardDiv.style.width = '800px';
                cardDiv.style.height = '600px';
                cardDiv.style.background = 'linear-gradient(135deg, #ffffff 0%, #f8fafc 100%)';
                cardDiv.style.border = '4px solid #e5e7eb';
                cardDiv.style.borderRadius = '16px';
                cardDiv.style.padding = '30px';
                cardDiv.style.boxShadow = '0 10px 40px rgba(0,0,0,0.1)';
                cardDiv.style.position = 'relative';
                cardDiv.style.overflow = 'hidden';
                cardDiv.style.fontFamily = 'system-ui, sans-serif';

                // Subtle background pattern
                cardDiv.style.backgroundImage = `
                    radial-gradient(circle at 25% 25%, rgba(37, 99, 235, 0.03) 0%, transparent 50%),
                    radial-gradient(circle at 75% 75%, rgba(249, 115, 22, 0.03) 0%, transparent 50%)
                `;

                // Album cover (smaller and positioned left)
                const coverImg = document.createElement('img');
                coverImg.src = currentAlbum.imageUrl;
                coverImg.style.width = '300px';
                coverImg.style.height = '300px';
                coverImg.style.borderRadius = '12px';
                coverImg.style.objectFit = 'cover';
                coverImg.style.boxShadow = '0 8px 25px rgba(0,0,0,0.15)';
                coverImg.style.border = '3px solid #ffffff';
                coverImg.style.position = 'absolute';
                coverImg.style.top = '30px';
                coverImg.style.left = '30px';
                cardDiv.appendChild(coverImg);

                // Album info (right side)
                const infoDiv = document.createElement('div');
                infoDiv.style.position = 'absolute';
                infoDiv.style.top = '60px';
                infoDiv.style.right = '30px';
                infoDiv.style.left = '360px';
                infoDiv.style.textAlign = 'left';

                const title = document.createElement('h1');
                title.textContent = currentAlbum.title;
                title.style.fontSize = '32px';
                title.style.fontWeight = '700';
                title.style.color = '#1f2937';
                title.style.margin = '0 0 8px 0';
                title.style.lineHeight = '1.2';
                title.style.letterSpacing = '0.5px';
                infoDiv.appendChild(title);

                const artist = document.createElement('p');
                artist.textContent = currentAlbum.artist;
                artist.style.fontSize = '20px';
                artist.style.fontWeight = '500';
                artist.style.color = '#6b7280';
                artist.style.margin = '0 0 16px 0';
                artist.style.fontStyle = 'italic';
                infoDiv.appendChild(artist);

                // Release year
                const yearDiv = document.createElement('div');
                yearDiv.style.display = 'flex';
                yearDiv.style.alignItems = 'center';
                yearDiv.style.gap = '8px';

                const yearLabel = document.createElement('span');
                yearLabel.textContent = 'Released';
                yearLabel.style.fontSize = '14px';
                yearLabel.style.color = '#9ca3af';
                yearLabel.style.fontWeight = '500';
                yearDiv.appendChild(yearLabel);

                const yearValue = document.createElement('span');
                yearValue.textContent = new Date(currentAlbum.releaseDate).getFullYear();
                yearValue.style.fontSize = '16px';
                yearValue.style.fontWeight = '600';
                yearValue.style.color = '#374151';
                yearValue.style.background = '#f3f4f6';
                yearValue.style.padding = '4px 12px';
                yearValue.style.borderRadius = '8px';
                yearDiv.appendChild(yearValue);

                infoDiv.appendChild(yearDiv);
                cardDiv.appendChild(infoDiv);

                // MusicRx branding (bottom center)
                const brandingDiv = document.createElement('div');
                brandingDiv.style.position = 'absolute';
                brandingDiv.style.bottom = '30px';
                brandingDiv.style.left = '50%';
                brandingDiv.style.transform = 'translateX(-50%)';
                brandingDiv.style.textAlign = 'center';
                brandingDiv.style.display = 'flex';
                brandingDiv.style.alignItems = 'center';
                brandingDiv.style.gap = '8px';

                // Heart logo
                const logoSpan = document.createElement('span');
                logoSpan.className = 'logo-symbol';
                logoSpan.style.display = 'inline-block';

                const heartIcon = document.createElement('i');
                heartIcon.className = 'fas fa-heartbeat';
                heartIcon.style.fontSize = '20px';
                heartIcon.style.color = '#f97316';

                logoSpan.appendChild(heartIcon);
                brandingDiv.appendChild(logoSpan);

                const brandingText = document.createElement('span');
                brandingText.textContent = 'MusicRx';
                brandingText.style.fontSize = '18px';
                brandingText.style.fontWeight = '600';
                brandingText.style.color = '#f97316';
                brandingDiv.appendChild(brandingText);

                cardDiv.appendChild(brandingDiv);

                // Add to DOM temporarily for html2canvas
                document.body.appendChild(cardDiv);

                // Generate canvas
                const canvas = await html2canvas(cardDiv, {
                    width: 800,
                    height: 600,
                    backgroundColor: '#ffffff',
                    scale: 1
                });

                // Remove from DOM
                document.body.removeChild(cardDiv);

                // Create download link
                const link = document.createElement('a');
                link.download = `${currentAlbum.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_musicrx.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

            } catch (error) {
                console.error('Download error:', error);
                alert('Failed to generate album card. Please try again.');
            } finally {
                downloadBtn.innerHTML = originalText;
                downloadBtn.disabled = false;
            }
        }

        // Handle Enter key
        document.getElementById('albumIdInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                selectAlbum();
            }
        });
    </script>
</body>
</html>
