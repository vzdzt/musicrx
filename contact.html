
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicRx - Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific styling for contact page title */
        .contact-title {
            color: #ff00cc;
            text-shadow: 0 0 10px #ff00cc;
        }

        .contact-title::after {
            text-shadow: -2px 0 #ff00cc !important;
        }

        .contact-form {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-control {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            transition: all 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 247, 255, 0.3);
        }
        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }
        .submit-btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-family: 'Syncopate', sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            background: var(--primary);
            color: var(--dark);
        }
    </style>
</head>
<body>
    <div id="cursor"></div>
    <div id="cursor-blur"></div>
    <canvas id="universe"></canvas>
    <nav>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="reviews.html" class="nav-link">Reviews</a></li>
            <li><a href="features.html" class="nav-link">Features</a></li>
            <li><a href="news.html" class="nav-link">News</a></li>
            <li><a href="opinions.html" class="nav-link">Opinions</a></li>
            <li><a href="interviews.html" class="nav-link">Interviews</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="contact.html" class="nav-link">Contact</a></li>
            <li><a href="catchcarti.html" class="nav-link">Catch Carti</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="glitch contact-title" data-text="CONTACT">CONTACT</h1>
        <div class="card-title-container">Get In Touch</div>
        <div class="glass-card">
            <p>Have a question, suggestion, or just want to chat about music? Fill out the form below and we'll get back to you.</p>
            <br>
            <div class="contact-form">
                <form action="#" method="POST" id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" class="form-control" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
